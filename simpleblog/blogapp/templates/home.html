{% extends 'index.html' %}
{% block title %} SimpleBlog {% endblock %}

{% block content %}




<h1>Posts</h1>

<ul>
{%for post in object_list%}
    <li><a href="{% url 'blog-details' post.pk %}">
        {{ post.title }}
        </a> from {{ post.author }} - <a href ="{% url 'update_post' post.pk %}">
            Edit
        </a>
    <br/>
        {{ post.body }}
    </li>
    {% empty %}
    <li>No Posts available.</li>
{% endfor %}
</ul>

{% endblock %}
