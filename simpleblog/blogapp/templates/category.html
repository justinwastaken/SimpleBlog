{% extends 'index.html' %}
{% block title %} {{ category.name | title }} {% endblock %}

{% block content %}

<h1> Category: {{ category.name | title }} </h1>

<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'blog-details' post.pk %}">
                {{ post.title }}
            </a>
        </li>
    {% empty %}
        <li>No posts in this category.</li>
    {% endfor %}
</ul>

{% endblock %}
