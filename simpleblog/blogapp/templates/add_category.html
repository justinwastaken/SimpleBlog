{% extends 'index.html' %}
{% block title %} Create a new Blog Category! {% endblock %}

{% block content %}

{% if user.is_authenticated %}

<h1>Add a new Category</h1>
</br>
</br>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-secondary">Add</button>
</form>

{% else %}
Please authorize yourself before you enter this url.


{% endif %}
{% endblock %}
