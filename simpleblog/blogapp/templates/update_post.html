{% extends 'index.html' %}
{% block title %} Update your Blog Post! {% endblock %}

{% block content %}
{% if user.is_authenticated %}

<h1>Edit Blog Post</h1>
</br>
</br>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-secondary">Submit</button> 
    <a href="{% url 'delete_post' object.pk %}" class="btn btn-danger">Delete Post</a>
</form>

{% else %}
Please authorize yourself before you enter this url.

{% endif %}
{% endblock %}
